[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py-monitor"
version = "0.1.0"
description = "Anomaly analytics over Azure Application Insights and AWS X-Ray telemetry"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # the core runs on the standard library only

[project.optional-dependencies]
azure = ["azure-monitor-query>=1.3", "azure-identity>=1.15"]
aws = ["boto3>=1.34"]
all = ["py-monitor[azure,aws]"]
dev = ["pytest>=8"]

[project.scripts]
py-monitor = "py_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
